# To generate authenticate push to GH actions cache token ${{ secrets.ATTIC_PUSH_TOKEN }}:
# $ sudo atticd-atticadm make-token \
#   --sub truelecter \
#   --validity 10y \
#   --pull workflows \
#   --push workflows \
#   --create-cache workflows \
#   --configure-cache workflows \
#   --configure-cache-retention workflows

name: Build machine configurations
on:
  push:
  workflow_call:

jobs:
  # The host list comes from the flake: `ciMatrix.hosts` in parts/ci.nix maps
  # every nixosConfigurations and darwinConfigurations entry to a runner.
  host_matrix:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.eval.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment
        with:
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate host matrix
        id: eval
        run: echo "hosts=$(nix eval --json .#ciMatrix.hosts)" >> "$GITHUB_OUTPUT"

  # Several aarch64 hosts (the Raspberry Pi ones) use the same kernel. Build
  # each kernel shared by two or more hosts once here and push it to Attic, so
  # the host jobs below substitute it instead of each building its own copy.
  # `ci.<system>.shared-kernels` is defined in nixos/default.nix.
  build_shared_kernels:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Bind mount /nix
        run: |
          sudo mkdir /mnt/nix /nix
          sudo chmod 0755 /nix
          sudo mount --bind /mnt/nix /nix

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment
        with:
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared kernels
        run: nix build --keep-going --no-link -L .#ci.aarch64-linux.shared-kernels

  build_system:
    name: build_system (${{ matrix.hostname }})
    needs: [host_matrix, build_shared_kernels]
    # A failed kernel build must not skip unrelated hosts.
    if: ${{ !cancelled() && needs.host_matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host_matrix.outputs.hosts) }}

    runs-on: ${{ matrix.os }}
    steps:
      # Filesystem on /mnt for some reason has more space on GitHub action
      # runner than /
      - name: Bind mount /nix
        if: ${{ ! startsWith(matrix.os, 'macos') }}
        run: |
          sudo mkdir /mnt/nix /nix
          sudo chmod 0755 /nix
          sudo mount --bind /mnt/nix /nix

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment
        with:
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tailscale
        if: ${{ startsWith(matrix.os, 'macos') }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: tl-mm4

      - name: Create aarch64-linux builder
        if: ${{ startsWith(matrix.os, 'macos') }}
        env:
          BUILDER_PK: ${{secrets.AARCH64_BUILDER_PK}}
          BUILDER_HOST: tl-mm4
          BUILDER_PORT: 3022
        run: |
          echo "$BUILDER_PK" | sudo tee /etc/nix/builder_ed25519 > /dev/null
          sudo chmod 600 /etc/nix/builder_ed25519

          sudo mkdir -p /var/root/.ssh
          # sshd may briefly refuse connections; an empty scan leads to
          # "Host key verification failed" later, so retry until keys arrive.
          for attempt in 1 2 3 4 5; do
            keys=$(ssh-keyscan -H -p "$BUILDER_PORT" "$BUILDER_HOST" 2>/dev/null || true)
            [ -n "$keys" ] && break
            echo "ssh-keyscan returned no keys (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          [ -n "$keys" ] || { echo "::error::no host keys from $BUILDER_HOST:$BUILDER_PORT"; exit 1; }
          echo "$keys" | sudo tee -a /var/root/.ssh/known_hosts > /dev/null

          mkdir -p /etc/ssh/
          echo "Host linux-builder"                           | sudo tee -a /etc/ssh/ssh_config
          echo "  Hostname $BUILDER_HOST"                     | sudo tee -a /etc/ssh/ssh_config > /dev/null
          echo "  Port $BUILDER_PORT"                         | sudo tee -a /etc/ssh/ssh_config
          echo "  HostKeyAlias [$BUILDER_HOST]:$BUILDER_PORT" | sudo tee -a /etc/ssh/ssh_config > /dev/null
          echo "  IdentityFile /etc/nix/builder_ed25519"      | sudo tee -a /etc/ssh/ssh_config
          echo "  User gha-builder"                           | sudo tee -a /etc/ssh/ssh_config

          echo "ssh://linux-builder aarch64-linux /etc/nix/builder_ed25519 4 40 nixos-test,benchmark,kvm,big-parallel - -" | sudo tee /etc/nix/machines

          sudo nix store info --store ssh://linux-builder

      - name: Build system configuration
        run: nix build --keep-going -L ".#${{ matrix.attr }}"

  hosts_aggregated:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [host_matrix, build_shared_kernels, build_system]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
