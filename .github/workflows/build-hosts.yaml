# To generate authenticate push to GH actions cache token ${{ secrets.ATTIC_PUSH_TOKEN }}:
# $ sudo atticd-atticadm make-token \
#   --sub truelecter \
#   --validity 10y \
#   --pull workflows \
#   --push workflows \
#   --create-cache workflows \
#   --configure-cache workflows \
#   --configure-cache-retention workflows

name: Build machine configurations
on:
  push:
  workflow_call:

jobs:
  # Both matrices come from the flake (parts/ci.nix): `ciMatrix.shared` lists the
  # `ci.<system>.<name>` derivations, `ciMatrix.hosts` every NixOS and darwin host.
  ci_matrix:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.eval.outputs.shared }}
      hosts: ${{ steps.eval.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment
        with:
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate matrices
        id: eval
        run: |
          echo "shared=$(nix eval --json .#ciMatrix.shared)" >> "$GITHUB_OUTPUT"
          echo "hosts=$(nix eval --json .#ciMatrix.hosts)" >> "$GITHUB_OUTPUT"

  # Heavy derivations several hosts share, such as the kernel of the Raspberry
  # Pi hosts (`ci.<system>.shared-kernels` in nixos/default.nix). Each is built
  # once here and pushed to Attic, so the host jobs below substitute it instead
  # of each building its own copy.
  build_shared:
    name: build_shared (${{ matrix.name }}, ${{ matrix.system }})
    needs: [ci_matrix]
    # An empty matrix is an error, so skip the job when there is nothing to build.
    if: ${{ needs.ci_matrix.outputs.shared != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci_matrix.outputs.shared) }}

    runs-on: ${{ matrix.os }}
    steps:
      - name: Bind mount /nix
        if: ${{ ! startsWith(matrix.os, 'macos') }}
        run: |
          sudo mkdir /mnt/nix /nix
          sudo chmod 0755 /nix
          sudo mount --bind /mnt/nix /nix

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment
        with:
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        run: nix build --keep-going --no-link -L ".#${{ matrix.attr }}"

  build_system:
    name: build_system (${{ matrix.hostname }})
    needs: [ci_matrix, build_shared]
    # A failed or skipped shared build must not skip the hosts.
    if: ${{ !cancelled() && needs.ci_matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci_matrix.outputs.hosts) }}

    runs-on: ${{ matrix.os }}
    steps:
      # Filesystem on /mnt for some reason has more space on GitHub action
      # runner than /
      - name: Bind mount /nix
        if: ${{ ! startsWith(matrix.os, 'macos') }}
        run: |
          sudo mkdir /mnt/nix /nix
          sudo chmod 0755 /nix
          sudo mount --bind /mnt/nix /nix

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment
        with:
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tailscale
        if: ${{ startsWith(matrix.os, 'macos') }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: tl-mm4

      - name: Create aarch64-linux builder
        if: ${{ startsWith(matrix.os, 'macos') }}
        env:
          BUILDER_PK: ${{secrets.AARCH64_BUILDER_PK}}
          BUILDER_HOST: tl-mm4
          BUILDER_PORT: 3022
        run: |
          echo "$BUILDER_PK" | sudo tee /etc/nix/builder_ed25519 > /dev/null
          sudo chmod 600 /etc/nix/builder_ed25519

          sudo mkdir -p /var/root/.ssh
          # Scan only the ed25519 key, the one ssh uses (HostKeyAlgorithms below).
          # A scan of every key type opens several connections at once, and the
          # VM's sshd drops some of them ("Broken pipe"), so it can come back with
          # only the RSA key or none. ssh-keyscan also prints a `# host SSH-2.0-...`
          # comment per connection on stdout, so check for the key line itself.
          for attempt in 1 2 3 4 5; do
            keys=$(ssh-keyscan -H -t ed25519 -p "$BUILDER_PORT" "$BUILDER_HOST" 2>/dev/null | grep ' ssh-ed25519 ' || true)
            [ -n "$keys" ] && break
            echo "ssh-keyscan returned no ed25519 key (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          [ -n "$keys" ] || { echo "::error::no ed25519 host key from $BUILDER_HOST:$BUILDER_PORT"; exit 1; }
          echo "$keys" | sudo tee -a /var/root/.ssh/known_hosts > /dev/null

          mkdir -p /etc/ssh/
          echo "Host linux-builder"                           | sudo tee -a /etc/ssh/ssh_config
          echo "  Hostname $BUILDER_HOST"                     | sudo tee -a /etc/ssh/ssh_config > /dev/null
          echo "  Port $BUILDER_PORT"                         | sudo tee -a /etc/ssh/ssh_config
          echo "  HostKeyAlias [$BUILDER_HOST]:$BUILDER_PORT" | sudo tee -a /etc/ssh/ssh_config > /dev/null
          echo "  HostKeyAlgorithms ssh-ed25519"              | sudo tee -a /etc/ssh/ssh_config > /dev/null
          echo "  IdentityFile /etc/nix/builder_ed25519"      | sudo tee -a /etc/ssh/ssh_config
          echo "  User gha-builder"                           | sudo tee -a /etc/ssh/ssh_config

          echo "ssh://linux-builder aarch64-linux /etc/nix/builder_ed25519 4 40 nixos-test,benchmark,kvm,big-parallel - -" | sudo tee /etc/nix/machines

          sudo nix store info --store ssh://linux-builder

      - name: Build system configuration
        run: nix build --keep-going -L ".#${{ matrix.attr }}"

  hosts_aggregated:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [ci_matrix, build_shared, build_system]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        # build_shared is skipped when there is nothing shared to build.
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || needs.ci_matrix.result != 'success'
            || needs.build_system.result != 'success'
          }}
