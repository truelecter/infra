# Orca slicer M106 P<n>: maps fan<n> to a Klipper fan through _USER_VARIABLES fan_map; unmapped fans are ignored.
[gcode_macro M106]
gcode:
  {% set fan_map = printer["gcode_macro _USER_VARIABLES"].fan_map %}
  {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
  {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}

  {% if fan in fan_map %}
    SET_FAN_SPEED FAN={fan_map[fan]} SPEED={speed}
  {% endif %}
