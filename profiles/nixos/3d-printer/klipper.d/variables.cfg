# Defaults for the shared macros. Override single variables in the host's
# printer.cfg by repeating the section:
#
#   [gcode_macro _USER_VARIABLES]
#   variable_end_print_retract: 10

[gcode_macro _USER_VARIABLES]
# Optional hardware and features used by START_PRINT, END_PRINT and HEATSOAK.
variable_chamber_sensor_enabled: False # [temperature_sensor chamber]
variable_status_leds_enabled: False    # _STATUS_HEATING, _STATUS_READY, _STATUS_PRINTING
variable_nevermore_enabled: False      # _NEVERMORE_PRINT_START, _NEVERMORE_PRINT_END
variable_qgl_enabled: False            # [quad_gantry_level], through _CQGL
variable_nozzle_clean_enabled: False   # CLEAN_NOZZLE_PARK, CLEAN_NOZZLE

# PARK_* macros
variable_park_speed: 325               # mm/s
variable_park_rear_margin: 10          # mm from the X min and Y max edges

# BED_MESH_CALIBRATE (modules/cartographer.cfg)
variable_bed_mesh_square_corner_velocity: 0 # while meshing; 0 keeps the current one

# M106 (features/orca-fan-compat.cfg): slicer fan index -> fan name
variable_fan_map: {"fan0": "part_cooling"}

# HEATSOAK
variable_heatsoak_z_ratio: 0.0         # with MOVE=1, raise Z to this share of its max; 0 keeps Z

# START_PRINT
variable_cartographer_touch_speed: 0   # SPEED of CARTOGRAPHER_TOUCH_HOME; 0 uses its default

# END_PRINT
variable_end_print_retract: 5          # mm
variable_end_print_z_lift: 2           # mm, capped at Z max
variable_end_print_cartographer_model: "" # CARTOGRAPHER_MODEL_SELECT NAME after the print; empty skips it
gcode:
  {action_respond_info("Variables store for the shared macros. Does nothing by itself")}
