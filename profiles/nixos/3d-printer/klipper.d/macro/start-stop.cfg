[gcode_macro START_PRINT]
description: Commands to run before print
variable_bedtemp: 0
variable_hotendtemp: 0
variable_chambertemp: 0
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  G92 E0
  {% set BED_TEMP = params.BED_TEMP|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set Z_ADJUST = params.Z_ADJUST|default(0.0)|float %}

  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bedtemp VALUE={BED_TEMP}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=hotendtemp VALUE={EXTRUDER_TEMP}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=chambertemp VALUE={CHAMBER_TEMP}
  CLEAR_PAUSE

  {% if vars.nevermore_enabled %}
    _NEVERMORE_PRINT_START
  {% endif %}

  M140 S{BED_TEMP}

  SET_GCODE_OFFSET Z=0
  _CG28
  BED_MESH_CLEAR

  # Without a chamber sensor, always soak with the move.
  {% set chamber_cold = not vars.chamber_sensor_enabled or printer['temperature_sensor chamber'].temperature < CHAMBER_TEMP %}
  {% if chamber_cold or printer.heater_bed.temperature < (BED_TEMP - 2) %}
    HEATSOAK T={BED_TEMP} C={CHAMBER_TEMP} H=150 MOVE=1 WAIT=1 NOTIFY=0
  {% else %}
    HEATSOAK T={BED_TEMP} C={CHAMBER_TEMP} H=150 MOVE=0 WAIT=1 NOTIFY=0
  {% endif %}

  {% if vars.qgl_enabled %}
    _CQGL
  {% endif %}

  G90

  BED_MESH_CALIBRATE ADAPTIVE=1

  {% if vars.nozzle_clean_enabled %}
    CLEAN_NOZZLE_PARK
    CLEAN_NOZZLE
  {% endif %}

  {% if vars.cartographer_touch_speed > 0 %}
    CARTOGRAPHER_TOUCH_HOME SPEED={vars.cartographer_touch_speed}
  {% else %}
    CARTOGRAPHER_TOUCH_HOME
  {% endif %}

  SMART_PARK

  M104 S{EXTRUDER_TEMP}
  M109 S{EXTRUDER_TEMP}

  LINE_PURGE

  {% if Z_ADJUST %}
    { action_respond_info('Adjusting gcode z-offset by %s' % (Z_ADJUST, )) }
    SET_GCODE_OFFSET Z_ADJUST={Z_ADJUST} MOVE=1
  {% endif %}

  M400
  _ENABLE_FILAMENT_SENSOR

  {% if vars.status_leds_enabled %}
    _STATUS_PRINTING
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  END_PRINT

[gcode_macro END_PRINT]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  CLEAR_PAUSE
  M400

  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = [vars.end_print_z_lift, max_z - act_z]|min %}

  G91

  {% if printer.extruder.can_extrude %}
    # Pull back the filament a little bit
    G92 E0
    G1 E-2 F2100
    G1 Z{z_safe} F3000
    G1 E-{vars.end_print_retract} F600
  {% else %}
    G1 Z{z_safe} F3000
  {% endif %}

  M104 S0
  M140 S{printer["gcode_macro START_PRINT"].bedtemp|int}
  M107

  PARK_REAR

  _DISABLE_FILAMENT_SENSOR

  {% if vars.nevermore_enabled %}
    _NEVERMORE_PRINT_END
  {% endif %}

  _RESTORE_TRAVEL_SPEED

  {% if vars.end_print_cartographer_model %}
    CARTOGRAPHER_MODEL_SELECT NAME={vars.end_print_cartographer_model}
  {% endif %}
