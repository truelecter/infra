# Without a filament sensor module these do nothing; modules/btt-sfs.cfg replaces them.

[gcode_macro _DISABLE_FILAMENT_SENSOR]
gcode:
  { action_respond_info('Ignoring disable filament sensor request') }

[gcode_macro _ENABLE_FILAMENT_SENSOR]
gcode:
  { action_respond_info('Ignoring enable filament sensor request') }
