[gcode_macro PARK_CENTER]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  _CG28
  SAVE_GCODE_STATE NAME=PARKCENTER
  G90
  G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F{vars.park_speed * 60}
  RESTORE_GCODE_STATE NAME=PARKCENTER

[gcode_macro PARK_REAR]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  _CG28
  SAVE_GCODE_STATE NAME=PARKREAR
  G90
  G0 X{printer.toolhead.axis_minimum.x+vars.park_rear_margin} Y{printer.toolhead.axis_maximum.y-vars.park_rear_margin} F{vars.park_speed * 60}
  RESTORE_GCODE_STATE NAME=PARKREAR

[gcode_macro PARK_FRONT]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  _CG28
  SAVE_GCODE_STATE NAME=PARKFRONT
  G90
  G0 X{printer.toolhead.axis_minimum.x/2} Y{printer.toolhead.axis_minimum.y+10} F{vars.park_speed * 60}
  RESTORE_GCODE_STATE NAME=PARKFRONT

[gcode_macro PARK_MAINTENANCE]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  _CG28
  SAVE_GCODE_STATE NAME=PARKMAINTENANCE
  G90
  G0 Z{printer.toolhead.axis_maximum.z/2} F900
  G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+10} F{vars.park_speed * 60}
  RESTORE_GCODE_STATE NAME=PARKMAINTENANCE
