[gcode_macro HEATSOAK]
gcode:
  {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
  {% set t = params.T|default(95)|int %}
  {% set c = params.C|default(45)|int %}
  {% set h = params.H|default(150)|int %}
  {% set move = params.MOVE|default(1)|int %}
  {% set wait = params.WAIT|default(0)|int %}
  {% set notify = params.NOTIFY|default(1)|int %}

  SAVE_GCODE_STATE NAME=HEATSOAK

  M104 S{h}
  M140 S{t}

  {% if move == 1 %}
    _CG28
    PARK_CENTER
    {% if vars.heatsoak_z_ratio > 0 %}
      G90
      G0 Z{printer.toolhead.axis_maximum.z * vars.heatsoak_z_ratio} F900
    {% endif %}
  {% endif %}

  {% if vars.chamber_sensor_enabled and c > 30 and wait == 1 %}
    {% if vars.status_leds_enabled %}
      _STATUS_HEATING
    {% endif %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={c}
    {% if vars.status_leds_enabled %}
      _STATUS_READY
    {% endif %}
  {% endif %}

  M109 S{h}
  M190 S{t}

  RESTORE_GCODE_STATE NAME=HEATSOAK

  {% if notify == 1 %}
    INFORM MESSAGE="Heatsoak finished!"
  {% endif %}
