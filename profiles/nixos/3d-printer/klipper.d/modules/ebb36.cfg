# BTT EBB36 CAN v1.1/v1.2 as the `toolhead` MCU: the board's fixed pins.
# The host sets the thermistor, extruder geometry, driver tuning and fan ports.

[adxl345 toolhead]
cs_pin: toolhead: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
step_pin: toolhead: PD0
dir_pin: toolhead: PD1
enable_pin: !toolhead: PD2
heater_pin: toolhead: PB13

[tmc2209 extruder]
uart_pin: toolhead: PA15
sense_resistor: 0.110
