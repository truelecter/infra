[include ./hardware/*.cfg]
[include ./features/*.cfg]
[include ./macro/*.cfg]

[pause_resume]
[display_status]
[exclude_object]

[virtual_sdcard]
on_error_gcode: CANCEL_PRINT

[idle_timeout]
timeout: 1200

[respond]

[gcode_arcs]

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 35000
max_z_velocity: 20
max_z_accel: 1500
square_corner_velocity: 30
