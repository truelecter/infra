[include ./modules/ebb36.cfg]
[include ./modules/cartographer.cfg]
[include ./modules/chopper-tuner.cfg]

[printer]
max_velocity: 300
max_accel: 10000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 5.0

[gcode_macro _USER_VARIABLES]
variable_chamber_sensor_enabled: True
variable_park_rear_margin: 1
variable_heatsoak_z_ratio: 0.5
variable_cartographer_touch_speed: 1
variable_end_print_z_lift: 40
variable_end_print_cartographer_model: "default"
variable_fan_map: {"fan0": "part_cooling", "fan1": "nevermore", "fan2": "aux_cooler", "fan3": "nevermore"}
