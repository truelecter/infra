[include ./features/*.cfg]
[include ./hardware/*.cfg]
[include ./macro/*.cfg]
# [include ./danger.cfg]

[pause_resume]
[display_status]
[exclude_object]

[virtual_sdcard]
on_error_gcode: CANCEL_PRINT

[idle_timeout]
timeout: 1200

[respond]

[gcode_arcs]

[printer]
kinematics: corexy
max_accel: 25000
max_velocity: 500
max_z_velocity: 20
max_z_accel: 350
square_corner_velocity: 20.0
minimum_cruise_ratio: 0.25
