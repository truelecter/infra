[stepper_x]
endstop_pin: ^toolhead:PB6

[extruder]
# Rapido V1
# sensor_type: ATC Semitec 104NT-4-R025H42G
# sensor_pin: toolhead: PA3
# min_temp: 0
# max_temp: 350
# control: pid
# pid_Kp: 24.179
# pid_Ki: 2.178
# pid_Kd: 67.096


min_temp: 0
max_temp: 300

# Rapido Ace
# control: pid
# pid_Kp: 19.565
# pid_Ki: 7.673
# pid_Kd: 12.472

# Dragon Ace

# Orbiter V2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750

max_extrude_only_distance: 1000.0
max_extrude_cross_section: 500
max_extrude_only_velocity: 200
max_extrude_only_accel: 10000
# pressure_advance: 0.025 #to be calibrated
# pressure_advance_smooth_time: 0.03 #to be calibrated

[tmc2209 extruder]
# Orbiter V2
interpolate: true
run_current: 0.65
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

# [fan]
[fan_generic part_cooling]
pin: toolhead: PA0

[heater_fan hotend_fan]
pin: toolhead: PA1
heater: extruder
heater_temp: 50.0

[neopixel sb_leds]
pin: toolhead:PD3
chain_count: 1
color_order: GRB
initial_red: 0.0
initial_green: 0.0
initial_blue: 0.0
initial_white: 0.0
