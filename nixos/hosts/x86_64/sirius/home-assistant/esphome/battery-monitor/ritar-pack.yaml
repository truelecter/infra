# Entities for one Ritar pack, filled by ritar_pylon.h. Include with
# vars: {n: <pack ADD switch number>}. Names are what ritar_pylon.h binds to.
# Current sign follows the BMS: positive charging, negative discharging. The
# BMS reports anything below 1.0 A per pack as 0.
# Temperatures 1-4 are the cell sensors, 5 environment and 6 MOSFET in the
# order Ritar's BMSTool decodes them (RITAR.md); in measured data 5 read warmest.
sensor:
  - {
      platform: template,
      name: "Pack ${n} current",
      unit_of_measurement: A,
      device_class: current,
      state_class: measurement,
      accuracy_decimals: 2,
      update_interval: never,
    }
  - {
      platform: template,
      name: "Pack ${n} voltage",
      unit_of_measurement: V,
      device_class: voltage,
      state_class: measurement,
      accuracy_decimals: 2,
      update_interval: never,
    }
  - {
      platform: template,
      name: "Pack ${n} power",
      unit_of_measurement: W,
      device_class: power,
      state_class: measurement,
      accuracy_decimals: 0,
      update_interval: never,
    }
  - {
      platform: template,
      name: "Pack ${n} remaining capacity",
      unit_of_measurement: Ah,
      state_class: measurement,
      accuracy_decimals: 2,
      update_interval: never,
    }
  - {
      platform: template,
      name: "Pack ${n} state of charge",
      unit_of_measurement: "%",
      device_class: battery,
      state_class: measurement,
      accuracy_decimals: 1,
      update_interval: never,
    }
  - {
      platform: template,
      name: "Pack ${n} cycles",
      state_class: total_increasing,
      accuracy_decimals: 0,
      update_interval: never,
    }
  - {
      platform: template,
      name: "Pack ${n} cell min",
      unit_of_measurement: mV,
