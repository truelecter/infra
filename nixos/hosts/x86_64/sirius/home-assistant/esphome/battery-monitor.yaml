# Battery bank monitor: Ritar packs (LINK bus via an HW-0519 RS485 module,
# listen only) and a Victron SmartShunt (VE.Direct, listen only) on an
# ESP32-C6 Super Mini.
#
# Wiring:
#   The HW-0519 labels its pins from the MCU side: RXD is its data output,
#   TXD its data input. Its MAX485 is rated for 4.75-5.25 V, so it runs from
#   5 V.
#   HW-0519 VCC -> 5V         HW-0519 GND -> GND
#   HW-0519 RXD -> 1 kΩ -> GPIO3, GPIO3 -> 2.2 kΩ -> GND (about 3.4 V high)
#   HW-0519 TXD -> 5V (held high, so the auto-direction module never transmits)
#   HW-0519 A+ / B- -> master pack LINK-IN pin 7 / pin 8
#   VE.Direct 1 GND -> GND    VE.Direct 3 TX -> RX pad (GPIO17), direct: the
#   SmartShunt uses 3.3 V logic. VE.Direct 2 RX -> GPIO18, unused (for the HEX
#   protocol later). VE.Direct 4 (power) unconnected.
#   The ESP must be powered from an isolated supply (a USB charger): VE.Direct
#   GND is battery minus on the shunt's battery side.
#
# Build and flash from the dev shell: esphome run battery-monitor.yaml
# The `esphome` command decrypts ritar_battery_monitor.api_key and
# .ota_password from secrets/esphome.yaml and the Wi-Fi
# password from secrets/wifi.yaml into a temporary secrets.yaml.
esphome:
  name: battery-monitor
  friendly_name: Battery monitor
  includes:
    - battery-monitor/ritar_pylon.h

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # USB Serial/JTAG by default on the C6, both hardware UARTs stay free.
  logs:
    uart_debug: WARN

api:
  encryption:
    key: !secret ritar_battery_monitor_api_key

ota:
  - platform: esphome
    password: !secret ritar_battery_monitor_ota_password
  # firmware upload from the web page, no password
  - platform: web_server

# status page, logs and firmware upload at http://<device>/, no authentication
web_server:
  port: 80
  version: 3

wifi:
  ssid: Xata290
  password: !secret wifi_password

external_components:
  - source: github://KinDR007/VictronMPPT-ESPHOME@589923be68b67854d86df38922bb6da734ad30ac
    components: [victron]

packages:
  pack1: !include { file: battery-monitor/ritar-pack.yaml, vars: { n: 1 } }
  pack2: !include { file: battery-monitor/ritar-pack.yaml, vars: { n: 2 } }
  pack3: !include { file: battery-monitor/ritar-pack.yaml, vars: { n: 3 } }

uart:
  - id: ritar_bus
    rx_pin: GPIO3
    # nothing on GPIO2: the HW-0519 input is tied high, the bus is listen only
    baud_rate: 9600
    rx_buffer_size: 512
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\r"
      sequence:
        - lambda: ritar::handle_bytes(bytes);
  - id: vedirect
    rx_pin: GPIO17
    baud_rate: 19200
    rx_buffer_size: 256

interval:
  - interval: 30s
    then:
      - lambda: ritar::expire_stale();

victron:
  - id: shunt
    uart_id: vedirect
    throttle: 5s

sensor:
  - platform: victron
    victron_id: shunt
    battery_voltage:
      name: Shunt voltage
    battery_current:
      name: Shunt current
    instantaneous_power:
      name: Shunt power
    state_of_charge:
      name: Shunt state of charge
    consumed_amp_hours:
      name: Shunt consumed Ah
    time_to_go:
      name: Shunt time to go
    min_battery_voltage:
      name: Shunt min voltage
    max_battery_voltage:
      name: Shunt max voltage
    number_of_charge_cycles:
      name: Shunt charge cycles
    amount_of_charged_energy:
      name: Shunt charged energy
    amount_of_discharged_energy:
      name: Shunt discharged energy
  - platform: wifi_signal
    name: Wi-Fi signal
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: victron
    victron_id: shunt
    alarm_reason:
      name: Shunt alarm reason
    model_description:
      name: Shunt model
    firmware_version:
      name: Shunt firmware
