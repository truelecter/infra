# Battery bank monitor: Ritar packs (LINK bus via an HW-0519 RS485 module,
# listen only) and a Victron SmartShunt (VE.Direct, listen only) on an
# ESP32-C6 Super Mini. Enclosure: battery-monitor/enclosure.scad.
#
# Wiring:
#   HW-0519 TXD -> GPIO2      HW-0519 RXD -> 3V3 (held high, so the
#   HW-0519 VCC -> 3V3        auto-direction module never transmits)
#   HW-0519 GND -> GND        HW-0519 A+ / B- -> master pack LINK-IN pin 7 / pin 8
#   VE.Direct 1 GND -> GND    VE.Direct 3 TX -> RX (GPIO17)   pins 2, 4 unconnected
# Measure VE.Direct TX against GND first: at 5 V it needs a divider to 3.3 V.
#
# Build and flash: esphome run battery-monitor.yaml
# Needs secrets.yaml next to this file (not committed) with wifi_ssid,
# wifi_password, battery_monitor_api_key (32 bytes, base64) and
# battery_monitor_ota_password.
esphome:
  name: battery-monitor
  friendly_name: Battery monitor
  includes:
    - battery-monitor/ritar_pylon.h

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # USB Serial/JTAG by default on the C6, both hardware UARTs stay free.
  logs:
    uart_debug: WARN

api:
  encryption:
    key: !secret battery_monitor_api_key

ota:
  - platform: esphome
    password: !secret battery_monitor_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://KinDR007/VictronMPPT-ESPHOME@589923be68b67854d86df38922bb6da734ad30ac
    components: [victron]

packages:
  pack1: !include { file: battery-monitor/ritar-pack.yaml, vars: { n: 1 } }
  pack2: !include { file: battery-monitor/ritar-pack.yaml, vars: { n: 2 } }
  pack3: !include { file: battery-monitor/ritar-pack.yaml, vars: { n: 3 } }

uart:
  - id: ritar_bus
    rx_pin: GPIO2
    baud_rate: 9600
    rx_buffer_size: 512
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\r"
      sequence:
        - lambda: ritar::handle_bytes(bytes);
  - id: vedirect
    rx_pin: GPIO17
    baud_rate: 19200
    rx_buffer_size: 256

interval:
  - interval: 30s
    then:
      - lambda: ritar::expire_stale();

victron:
  - id: shunt
    uart_id: vedirect
    throttle: 5s

sensor:
  - platform: victron
    victron_id: shunt
    battery_voltage:
      name: Shunt voltage
    battery_current:
      name: Shunt current
    instantaneous_power:
      name: Shunt power
    state_of_charge:
      name: Shunt state of charge
    consumed_amp_hours:
      name: Shunt consumed Ah
    time_to_go:
      name: Shunt time to go
    min_battery_voltage:
      name: Shunt min voltage
    max_battery_voltage:
      name: Shunt max voltage
    number_of_charge_cycles:
      name: Shunt charge cycles
    amount_of_charged_energy:
      name: Shunt charged energy
    amount_of_discharged_energy:
      name: Shunt discharged energy
  - platform: wifi_signal
    name: Wi-Fi signal
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: victron
    victron_id: shunt
    alarm_reason:
      name: Shunt alarm reason
    model_description:
      name: Shunt model
    firmware_version:
      name: Shunt firmware
