# Inverter losses (self-consumption plus conversion) from the energy balance.
#
# Solarman's "Today Losses", "Total Losses" and "Power losses" add up the
# inverter's battery DC readings, which sit about 1 A towards charging
# (-55 to -76 W while the battery is full and idle on grid, against 0 A on the
# BMSes and the shunt). The balance goes negative, `uint: enforce` clamps it to
# 0, and the 0.0/0.1 flaps make the recorder start a new cycle each time and
# inflate the statistics. Keep them out of the recorder and compute losses
# here instead, with the battery side from the Victron SmartShunt on the
# battery monitor (`shunt` positive while charging):
#   grid + PV - shunt - load
# The result is clamped to 0 (sensor updates are a few seconds apart, so
# load steps give short negative spikes), and samples taken while the grid
# drops (grid state off, grid power not yet 0) are skipped.
recorder:
  exclude:
    entities:
      - sensor.inverter_today_losses
      - sensor.inverter_total_losses
      - sensor.inverter_power_losses

template:
  - sensor:
      - name: Inverter AC losses
        unique_id: inverter_ac_losses
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ is_state('binary_sensor.inverter_grid', ['on', 'off'])
             and states('sensor.inverter_load_power') | is_number
             and states('sensor.battery_monitor_shunt_power') | is_number
             and states('sensor.inverter_grid_power') | is_number
             and (is_state('binary_sensor.inverter_grid', 'on')
                  or states('sensor.inverter_grid_power') | float == 0) }}
        state: >
          {% set pv = states('sensor.inverter_pv_power') | float(0) %}
          {% set load = states('sensor.inverter_load_power') | float %}
          {% set shunt = states('sensor.battery_monitor_shunt_power') | float %}
          {% set grid = states('sensor.inverter_grid_power') | float %}
          {{ [grid + pv - shunt - load, 0] | max | round(0) }}

sensor:
  - platform: integration
    name: Inverter AC losses energy
    unique_id: inverter_ac_losses_energy
    source: sensor.inverter_ac_losses
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    max_sub_interval:
      minutes: 5

utility_meter:
  inverter_ac_losses_today:
    name: Inverter AC losses today
    unique_id: inverter_ac_losses_today
    source: sensor.inverter_ac_losses_energy
    cycle: daily
