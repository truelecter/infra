# Inverter losses (self-consumption plus conversion) from the energy balance.
#
# Solarman's "Today Losses", "Total Losses" and "Power losses" add up the
# inverter's battery DC readings, which sit a few tens of watts towards
# charging: about -55 W while the battery is full and idle on grid, where the
# AC side shows only about 40 W going into the inverter. The balance goes
# negative, `uint: enforce` clamps it to 0, and the 0.0/0.1 flaps make the
# recorder start a new cycle each time and inflate the statistics. Keep them
# out of the recorder and compute losses here instead:
#   grid + PV + (battery + offset) - load
# `offset` cancels that battery reading bias. Re-measure it after changing
# the battery bank: the mean battery power while full and idle on grid,
# negated (55 W with three packs, 2026-11; about 75 W with two). With it,
# idle, discharging and charging all give 40-60 W at low power.
# The result is clamped to 0, and samples taken while the grid drops (grid
# state off, grid power not yet 0) are skipped.
recorder:
  exclude:
    entities:
      - sensor.inverter_today_losses
      - sensor.inverter_total_losses
      - sensor.inverter_power_losses

template:
  - sensor:
      - name: Inverter AC losses
        unique_id: inverter_ac_losses
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ is_state('binary_sensor.inverter_grid', ['on', 'off'])
             and states('sensor.inverter_load_power') | is_number
             and states('sensor.inverter_battery_power') | is_number
             and states('sensor.inverter_grid_power') | is_number
             and (is_state('binary_sensor.inverter_grid', 'on')
                  or states('sensor.inverter_grid_power') | float == 0) }}
        state: >
          {% set offset = 55 %}
          {% set pv = states('sensor.inverter_pv_power') | float(0) %}
          {% set load = states('sensor.inverter_load_power') | float %}
          {% set battery = states('sensor.inverter_battery_power') | float + offset %}
          {% set grid = states('sensor.inverter_grid_power') | float %}
          {{ [grid + pv + battery - load, 0] | max | round(0) }}

sensor:
  - platform: integration
    name: Inverter AC losses energy
    unique_id: inverter_ac_losses_energy
    source: sensor.inverter_ac_losses
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    max_sub_interval:
      minutes: 5

utility_meter:
  inverter_ac_losses_today:
    name: Inverter AC losses today
    unique_id: inverter_ac_losses_today
    source: sensor.inverter_ac_losses_energy
    cycle: daily
